# .claude/heavy-test.ini — project facts for the heavy-test queue (fix-bug-parallel).
# Example: an `api` repo and a `web` repo side by side under one workspace root.
# Placeholders: {port} = the service's port · {state} = heavy-test's state dir for this project.
# Commands run with /bin/sh in the service's directory (main checkout or worktree).

[project]
# Branch the main checkouts should be on; heavy-test warns when one isn't.
main_branch = main
# Optional. Non-zero exit → the run stops as `not proven` (VPN down, docker not running …).
preflight = docker info >/dev/null 2>&1
# Optional. Environment for every command; $VARS expand. Machine-only values belong in
# heavy-test.local.ini beside this file, kept out of git.
# env = JAVA_HOME=/path/to/jdk
# Optional. Hand everything to your own queue script instead — see CONTRACT.md.
# command = ./scripts/my-queue

[service api]
# Repo directory, relative to the directory holding .claude/. Default: . (single-repo project).
repo = api
# Optional subdirectory inside the repo the commands run in.
# path = server
port = 8080
# Optional. Runs before start on `main up` and on every worktree swap.
build = ./gradlew bootJar -x test -q
start = java -jar build/libs/api.jar
env = SERVER_PORT={port} UPLOAD_DIR={state}/files
# Ready check: `health` (a URL answering < 400) or `ready` (a command exiting 0).
# Neither → the port accepting connections counts as ready.
health = http://localhost:{port}/actuator/health
boot_timeout = 300
# Optional. Default stop is SIGTERM to the service's process group.
# stop = ./bin/shutdown
# Gitignored files `heavy-test setup` copies from the main checkout into a new worktree (globs).
copy = src/main/resources/application-local.yml

[service web]
repo = web
port = 3000
start = pnpm dev
env = PORT={port}
health = http://localhost:{port}/
boot_timeout = 90
# The heavy test, run inside the worktree; `heavy-test e2e … -- <args>` appends args.
test = pnpm test:e2e
copy = .env.local
# Optional. Paths that, in a worktree, are links to the main checkout's — test evidence written
# there outlives the worktree. {ticket} = the worktree's name after `<repo>-`. A path holding
# tracked files is left alone, so point at a per-ticket folder when older results are committed.
share = test-results/{ticket}
install = pnpm install --frozen-lockfile
